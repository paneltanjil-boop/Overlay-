name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/etour/app app/src/main/assets
          mv MainActivity.kt OverlayService.kt OverlayBridge.kt EtourApp.kt app/src/main/java/com/etour/app/
          mv index.html app/src/main/assets/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle app/build.gradle
          mv debug.keystore app/
          mkdir -p app/src/main/res/drawable
          mv icon.png app/src/main/res/drawable/ic_launcher.png
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show error
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not |Caused by|incompatible|requires|Unresolved|error:" build.log | head -8 | cut -c1-300 | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | while read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: ETOUR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
